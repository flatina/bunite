<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Automation Target</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #fff; color: #1a202c; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  label { display: block; font-size: 13px; color: #4a5568; margin: 8px 0 4px; }
  input, textarea { width: 100%; padding: 8px; font-size: 14px; border: 1px solid #cbd5e0; border-radius: 4px; box-sizing: border-box; }
  button { margin-top: 8px; padding: 8px 16px; font-size: 14px; background: #4299e1; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
  button:hover { background: #3182ce; }
  #event-log { margin-top: 16px; padding: 10px; background: #edf2f7; border-radius: 4px; font-family: monospace; font-size: 12px; max-height: 140px; overflow-y: auto; white-space: pre-wrap; }
  .gradient { margin-top: 16px; height: 800px; background: linear-gradient(180deg, #fef3c7, #fca5a5, #c084fc, #60a5fa); border-radius: 8px; padding: 16px; color: #1a202c; }
</style></head><body>
<h1 id="title">Automation Target</h1>

<label for="name">Name</label>
<input id="name" placeholder="type here">

<label for="bio">Bio (multi-line)</label>
<textarea id="bio" rows="3" placeholder="press Enter to send"></textarea>

<button id="submit">Submit</button>

<div id="event-log"></div>

<div class="gradient">
  <p>Scrollable region — exercise <code>v.scroll({dx,dy})</code> to move down.</p>
  <p style="margin-top: 200px">200 px down</p>
  <p style="margin-top: 200px">400 px down</p>
  <p style="margin-top: 200px">600 px down</p>
</div>

<script>
  const log = document.getElementById("event-log");
  const stamp = () => new Date().toISOString().slice(11, 23);
  const append = (s) => { log.textContent = stamp() + " " + s + "\n" + log.textContent; };

  document.getElementById("submit").addEventListener("click", (e) => {
    append("[click] trusted=" + e.isTrusted + " shift=" + e.shiftKey + " ctrl=" + e.ctrlKey);
    document.title = "submit-" + Date.now();
  });
  document.getElementById("name").addEventListener("input", (e) => append("[input name] '" + e.target.value + "'"));
  document.getElementById("bio").addEventListener("input", (e) => append("[input bio] '" + e.target.value + "'"));
  document.addEventListener("keydown", (e) => append("[keydown] " + e.key + " (code=" + e.code + ") trusted=" + e.isTrusted));
  document.addEventListener("scroll", () => append("[scroll] y=" + window.scrollY), { passive: true });
</script>
</body></html>
